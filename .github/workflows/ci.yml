name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt

      - name: Validate Python files
        run: |
          python -m py_compile data_generator/*.py
          python -m py_compile ingestion/*.py

      - name: Install dbt
        run: |
          pip install dbt-snowflake==1.12.3

      - name: Install dbt dependencies
        working-directory: dbt_transformations
        run: dbt deps

      - name: Validate dbt project
        working-directory: dbt_transformations
        env:
          SNOWFLAKE_ACCOUNT: ci_dummy_account
          SNOWFLAKE_USER: ci_dummy_user
          SNOWFLAKE_PASSWORD: ci_dummy_password
          SNOWFLAKE_WAREHOUSE: ci_dummy_warehouse
          SNOWFLAKE_DATABASE: STREAMING_DB
          SNOWFLAKE_SCHEMA: RAW_SCHEMA
          SNOWFLAKE_ROLE: ACCOUNTADMIN
        run: dbt parse --no-partial-parse
