version: 2

models:

  - name: fct_realtime_revenue
    description: >
      Minute-grain revenue fact table with a trailing rolling-window GMV,
      order count, average order value, and cart-abandonment rate. Intended
      for DirectQuery consumption in Power BI's live GMV counter tile.
    columns:
      - name: minute_bucket
        tests:
          - unique
          - not_null
      - name: rolling_gmv
        tests:
          - not_null

  - name: dim_user_sessions
    description: >
      One row per user session with funnel stage, device, and revenue
      attribution. Powers the conversion funnel, top-categories, and
      device-mix dashboard tiles.
    columns:
      - name: session_id
        tests:
          - unique
          - not_null
      - name: funnel_stage
        tests:
          - accepted_values:
              arguments:
                values: ['browsed_only', 'added_to_cart', 'checkout_started', 'purchased', 'unknown']
      - name: device_type
        tests:
          - accepted_values:
              arguments:
                values: ['mobile', 'desktop', 'tablet']

  - name: dim_users
    description: One row per user with activity span, session/order counts and lifetime value.
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: lifetime_value
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: dim_products
    description: One row per product with dominant category, price range and engagement counts.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: Order-grain fact table (one row per purchase) keyed to dim_users, dim_products and dim_user_sessions.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: order_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: user_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: session_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_user_sessions')
                field: session_id
