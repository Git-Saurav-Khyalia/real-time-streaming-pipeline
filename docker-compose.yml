# ---------------------------------------------------------------------------
# Real-time e-commerce lakehouse, fully local:
#
#   producer -> Kafka -> Spark Structured Streaming -> Delta Lake on MinIO (S3)
#                         bronze -> silver -> gold
#   Airflow (profile "orchestration") -> Great Expectations -> Snowflake -> dbt
#
#   docker compose up -d --build                          # core pipeline
#   docker compose --profile orchestration up -d --build  # + Airflow
# ---------------------------------------------------------------------------

x-lake-env: &lake-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_TOPIC: ecommerce_events_raw
  LAKEHOUSE_BASE_PATH: s3a://ecommerce-lakehouse
  S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  AWS_REGION: us-east-1
  WATERMARK_DELAY: 10 minutes
  GX_ANALYTICS_ENABLED: "false"

x-snowflake-env: &snowflake-env
  SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
  SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
  SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
  SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
  SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-STREAMING_DB}
  SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-RAW_SCHEMA}
  SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-SYSADMIN}
  SNOWFLAKE_RAW_DATABASE: ${SNOWFLAKE_DATABASE:-STREAMING_DB}
  SNOWFLAKE_RAW_SCHEMA: ${SNOWFLAKE_SCHEMA:-RAW_SCHEMA}
  SNOWFLAKE_DBT_SCHEMA: ${SNOWFLAKE_DBT_SCHEMA:-DBT_DEV}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: ecommerce-airflow:local
  environment: &airflow-env
    <<: [*lake-env, *snowflake-env]
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-secret-key-change-me
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./lakehouse:/opt/pipeline/lakehouse
    - ./quality:/opt/pipeline/quality
    - ./warehouse:/opt/pipeline/warehouse
    - ./dbt_transformations:/opt/pipeline/dbt_transformations
  networks:
    - streaming-net
  depends_on:
    airflow-init:
      condition: service_completed_successfully

networks:
  streaming-net:
    driver: bridge

volumes:
  zk-data:
  zk-log:
  kafka-data:
  minio-data:
  ivy-cache:
  airflow-pg-data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-log:/var/lib/zookeeper/log
    networks:
      - streaming-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092" # host access (from your machine, e.g. Python scripts)
      - "29092:29092" # internal access (from other containers)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - streaming-net
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    hostname: schema-registry
    container_name: schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - streaming-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    networks:
      - streaming-net

  # Creates the topic up-front so Spark never races the producer.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ecommerce_events_raw --partitions 3 --replication-factor 1
    networks:
      - streaming-net

  # S3-compatible object store standing in for AWS S3 (bucket is created by the Spark job).
  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    networks:
      - streaming-net

  producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    image: ecommerce-producer:local
    container_name: producer
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    # Includes duplicates, late and invalid records so the pipeline's
    # de-duplication, watermarking and quarantine paths run continuously.
    command: >
      --bootstrap-servers kafka:29092 --topic ecommerce_events_raw --rate 10
      --duplicate-rate 0.03 --late-rate 0.05 --invalid-rate 0.01
    networks:
      - streaming-net

  spark-streaming:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: ecommerce-spark:local
    container_name: spark-streaming
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      <<: *lake-env
      SPARK_DRIVER_MEMORY: 1536m
    networks:
      - streaming-net

  # ------------------------------ orchestration (optional profile) ---------
  airflow-postgres:
    image: postgres:16
    profiles: ["orchestration"]
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    networks:
      - streaming-net

  airflow-init:
    <<: *airflow-common
    profiles: ["orchestration"]
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin
      --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    profiles: ["orchestration"]
    container_name: airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8088:8080"

  airflow-scheduler:
    <<: *airflow-common
    profiles: ["orchestration"]
    container_name: airflow-scheduler
    restart: unless-stopped
    command: scheduler

# ---------------------------------------------------------------------------
# Endpoints
#   Kafka UI        http://localhost:8080
#   MinIO console   http://localhost:9001   (minioadmin / minioadmin)
#   Airflow UI      http://localhost:8088   (admin / admin, profile "orchestration")
#   Schema Registry http://localhost:8081
#   Kafka bootstrap (host) localhost:9092   (containers) kafka:29092
# ---------------------------------------------------------------------------
